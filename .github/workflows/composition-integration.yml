name: AI0 composition integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  composition-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_USER: auto_in
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: autoin_test_pr66
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U auto_in -d autoin_test_pr66"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://auto_in:isolated_ci_only@127.0.0.1:5432/autoin_test_pr66
      TEST_DATABASE_URL: postgresql://auto_in:isolated_ci_only@127.0.0.1:5432/autoin_test_pr66
      AUTOIN_TEST_DATABASE_URL: postgresql://auto_in:isolated_ci_only@127.0.0.1:5432/autoin_test_pr66
      AUTOIN_ALLOW_PG_ACCEPTANCE: YES_ISOLATED_TEST_DB
      AUTOIN_OPERATION_MODE: simulation
    steps:
      # Run the workflow from this CI-only branch, but test the exact AI5 overlay.
      # Its runner intentionally rejects PR merge commits and any other HEAD.
      - uses: actions/checkout@v4
        with:
          ref: 80866832000592dcf6e0dc40511d6882667cd381
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r workers/documents/requirements-test.txt
      - name: Migrate isolated PostgreSQL before DB-backed checks
        run: npm run db:migrate
      - name: AI0 composition PostgreSQL and HTTP integration
        run: node --import tsx --test tests/integration/composition/*.test.*
      - name: Root typecheck and unit checks
        run: npm run check
      - name: AI5 independent PR66 acceptance on exact product overlay
        run: node tests/acceptance/run-pr66.mjs
