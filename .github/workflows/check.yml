name: CODE checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r workers/documents/requirements-test.txt
      - run: npm run check
      - name: Web clean install, tests, typecheck and build
        working-directory: web
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build

      - name: Install pinned browser test client
        run: python -m pip install playwright==1.57.0
      - name: Real Chromium desktop/mobile smoke on compiled AI4 demo
        run: python scripts/browser-smoke.py
