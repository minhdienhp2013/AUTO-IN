name: CODE checks
on:
  push:
    branches-ignore:
      - ai0/v1-claim-error-proof-20261020
      - ai0/v1-word-pdf-dryrun-integration-20261021
      - ai0/v1-color-intake-nodb-ci-20261025
      - ai0/v1-expanded-nodb-ci-parser-20261026
      - ai0/v1-expanded-nodb-ci-guard-20261026
      - ai0/v1-expanded-nodb-ci-guard-tighten-20261028
    tags-ignore:
      - v1-claim-diagnostic-*
  pull_request:
permissions:
  contents: read
jobs:
  check:
    if: >-
      (github.event_name != 'pull_request' || (github.head_ref != 'ai0/v1-claim-error-proof-20261020' &&
      github.head_ref != 'ai0/v1-color-intake-nodb-ci-20261025')) &&
      (github.event_name != 'pull_request' || github.head_ref != 'ai0/v1-expanded-nodb-ci-parser-20261026') &&
      (github.event_name != 'pull_request' || github.head_ref != 'ai0/v1-expanded-nodb-ci-guard-20261026') &&
      (github.event_name != 'pull_request' || github.head_ref != 'ai0/v1-expanded-nodb-ci-guard-tighten-20261028') &&
      (github.event_name != 'push' || (github.ref != 'refs/heads/ai0/v1-claim-error-proof-20261020' &&
      github.ref != 'refs/heads/ai0/v1-color-intake-nodb-ci-20261025' &&
      github.ref != 'refs/heads/ai0/v1-expanded-nodb-ci-parser-20261026' &&
      github.ref != 'refs/heads/ai0/v1-expanded-nodb-ci-guard-20261026' &&
      github.ref != 'refs/heads/ai0/v1-expanded-nodb-ci-guard-tighten-20261028' &&
      !startsWith(github.ref, 'refs/tags/v1-claim-diagnostic-')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install -r workers/documents/requirements-test.txt
      - name: Root checks without broad composition suite on diagnostic branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == 'refs/heads/ai0/v1-claim-error-proof-20261020' || "$GITHUB_HEAD_REF" == 'ai0/v1-claim-error-proof-20261020' ]]; then
            echo 'Diagnostic branch CODE gates: root checks excluding the composition suite.'
            npm run contracts:check
            npm run typecheck
            npm test
            npm run build
            npm run test:core
            npm run test:zalo
          else
            npm run check
          fi
