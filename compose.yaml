services:
  postgres:
    image: postgres:18.3
    environment:
      POSTGRES_DB: auto_in
      POSTGRES_USER: auto_in
      POSTGRES_PASSWORD: development_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - auto_in_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auto_in -d auto_in"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  auto_in_pg:
